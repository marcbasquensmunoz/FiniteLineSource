name: Run benchmarks

on:
  pull_request:

jobs:
  Benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.10'
      - uses: julia-actions/julia-buildpkg@latest
      - name: Setup benchmark environment
        run: |
          julia --project=benchmark -e 'using Pkg; Pkg.develop(path = "../FiniteLineSource"); Pkg.instantiate(); Pkg.resolve(); Pkg.precompile();'
      - name: Run benchmarks
        run: julia --project=benchmark -e 'using BenchmarkCI; BenchmarkCI.judge()'
      - name: Post results
        run: julia --project=benchmark -e 'using BenchmarkCI; BenchmarkCI.postjudge()'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



